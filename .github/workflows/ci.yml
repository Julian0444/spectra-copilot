name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Cross-interface tests need FM's fixture source as well as its package.
      - uses: actions/checkout@v4
        with:
          repository: Julian0444/desi-spectra-fm
          ref: v0.3.0
          path: _fm_source
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-checkpoint-desi-spectra-fm-v21
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # desi-fm is not published on PyPI. Publish FM and its tag before Copilot.
      - run: pip install "desi-fm[api] @ git+https://github.com/Julian0444/desi-spectra-fm.git@v0.3.0"
      - run: pip install -e ".[ui,dev]"
      - run: pytest -q tests
        env:
          SPECTRA_FM_SOURCE_ROOT: ${{ github.workspace }}/_fm_source
